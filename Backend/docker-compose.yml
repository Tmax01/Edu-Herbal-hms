services:
  postgres:
    image: postgres:16-alpine
    container_name: eduhms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eduhms_db
    ports:
      - "5432:5432"
    volumes:
      - eduhms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduhms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - eduhms_redisdata:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: eduhms-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - eduhms_miniodata:/data

volumes:
  eduhms_pgdata:
  eduhms_redisdata:
  eduhms_miniodata:
