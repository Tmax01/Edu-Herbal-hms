services:
  nginx:
    image: nginx:alpine
    container_name: eduhms-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - app

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eduhms-backend-api
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:

      NODE_ENV: production
      PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    container_name: eduhms-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretProdPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-eduhms_prod_db}
    volumes:
      - eduhms_prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduhms-prod-redis
    restart: always
    command: redis-server --requirepass "${REDIS_PASSWORD:-RedisProdSecure2026!}"
    volumes:
      - eduhms_prod_redisdata:/data

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: eduhms-prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-eduhms_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-EdUhMs_MiNiO_S3cUrE_2026!}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - eduhms_prod_miniodata:/data

volumes:
  eduhms_prod_pgdata:
  eduhms_prod_redisdata:
  eduhms_prod_miniodata:
