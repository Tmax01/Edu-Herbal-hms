name: EduHMS Enterprise Quality Assurance & Adversarial CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    name: Backend API - Quality & Adversarial Security Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './Backend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Run Backend Adversarial & Unit Test Suites
        run: npm test -- --coverage --runInBand

      - name: Verify Backend Build Artifact
        run: npm run build

  frontend-qa:
    name: Frontend Application - Unit, Integration & UI Test Suite
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './Frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npx tsc --noEmit

      - name: Run Vitest Suite (Unit, Integration & E2E)
        run: npm run test

      - name: Verify Production Frontend Build Bundle
        run: npm run build

  devops-container-qa:
    name: DevOps Infrastructure - Multi-Stage Container & Configuration Audit
    runs-on: ubuntu-latest
    needs: [backend-qa, frontend-qa]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configurations
        run: |
          docker compose -f Backend/docker-compose.yml config
          docker compose -f Backend/docker-compose.prod.yml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Build Backend Container
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: false
          tags: eduhms-backend:ci-test

      - name: Test Build Frontend Container
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          file: ./Frontend/Dockerfile
          push: false
          tags: eduhms-frontend:ci-test
